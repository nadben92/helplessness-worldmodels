[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "helplessness"
version = "0.1.0"
description = "Behavioural phenotypes of perceived uncontrollability in a model-based agent, with causal intervention on the learned world representation."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "scipy>=1.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# E3 (world model, src/helplessness/agents/worldmodel/ + e3_worldmodel-side
# scripts under experiments/E3_worldmodel_4zones/): the one place torch is
# a dependency of this project, gated behind this extra so the tabular
# phases (E0-E2) never need it. Install the CPU wheel from PyTorch's own
# index (see docs/e3/ for the exact command) -- this project's default
# PyPI-resolved "torch" wheel bundles CUDA runtimes this machine cannot
# use; a GPU training machine reinstalls the matching CUDA wheel there,
# same version pin, when phase 4 starts.
e3 = ["torch>=2.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

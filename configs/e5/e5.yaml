# E5 -- manipulating the belief through training (docs/E5_belief_training.md). Every training parameter is E4's:
# `base` is read whole and unchanged (e5_setup.load_config refuses any other key than base and e5). The E4 configuration
# of E5 is a run parameter (--configuration), set after E4's analysis.
base: configs/e4/e4.yaml
e5:
  seed_b_offset: 100          # seed B = seed A (E4's seed of the configuration) + 100
  shuffle:
    fractions: [1.0, 0.5]
  # the checkpoint measures under shuffle: the canonical assignment at EVERY checkpoint; the 12 assignments at these
  # checkpoints (and at the run's last one in any case; null = every checkpoint). Cost: IMPLEMENTATION_REPORT.md.
  shuffle_records:
    all_assignments_at: [10000, 25119, 63096, 100000, 150000, 200000, 250000, 300000]
  # the agent state's decodability (posterior reconstruction -> its own template) at the checkpoints up to until_step, in
  # the runs with one appearance (baseline, immunisation); the shuffle runs have it by assignment at every checkpoint
  decodability: {until_step: 100000, max_per_state: 5}
  # the estimator switch's statistic: any pair of the batch (E3/E4's, the default) or same_background (pairs of images
  # with the same background; docs/e5/DECISIONS.md (17): proposed, NOT active)
  switch_pairs: any
  immunisation:
    post_steps: 175000        # the grid point nearest to 175,000 (the B of E4's recomputed criterion)
  # the steps where the baseline reference of seed B keeps its full state (the immunisation of seed B branches from it):
  # E4's grid points from 10,000 on; the batch adds the chosen switch step when it is known
  resumable_candidates: [10000, 15849, 25119, 39811, 63096, 100000, 125000, 150000, 158489, 175000, 200000, 225000, 250000]

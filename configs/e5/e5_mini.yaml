# E5's CPU smoke configuration: configs/e4/e4_mini.yaml unchanged (a 3x4 latent, 600 environment steps), the e5 block
# scaled to it. Its numbers mean nothing; it only exercises every stage.
base: configs/e4/e4_mini.yaml
e5:
  seed_b_offset: 100
  shuffle:
    fractions: [1.0, 0.5]
  # the checkpoint measures under shuffle: the canonical assignment at EVERY checkpoint; the 12 assignments at these
  # checkpoints (and at the run's last one in any case; null = every checkpoint). Cost: IMPLEMENTATION_REPORT.md.
  shuffle_records:
    all_assignments_at: [400]
  # the agent state's decodability (posterior reconstruction -> its own template) at the checkpoints up to until_step, in
  # the runs with one appearance (baseline, immunisation); the shuffle runs have it by assignment at every checkpoint
  decodability: {until_step: 600, max_per_state: 2}
  # the estimator switch's statistic (and the collapse guard's): same_background, pairs of images with the same background
  # (docs/e5/DECISIONS.md (19)), on EVERY E5 run -- with one background (baseline, immunisation) it is E3/E4's statistic,
  # the same draws (bit for bit, tested); `any` would restore E3/E4's statistic everywhere
  switch_pairs: same_background
  immunisation:
    post_steps: 400
  resumable_candidates: [200, 400]

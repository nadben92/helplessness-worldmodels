   </g>
   <g id="text_10">
    <text style="font-size: 13px; font-family: 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #2b2a28" x="267.964992" y="280.816501" transform="rotate(-0 267.964992 280.816501)">posterior</text>

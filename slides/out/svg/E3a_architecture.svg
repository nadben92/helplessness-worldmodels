   </g>
   <g id="text_12">
    <text style="font-size: 13px; font-family: 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #2b2a28" x="443.025216" y="162.880501" transform="rotate(-0 443.025216 162.880501)">prior</text>
   </g>
   <g id="text_13">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #6e675c" x="443.025216" y="183.32323" transform="rotate(-0 443.025216 183.32323)">p(zₜ | hₜ)</text>
   </g>
   <g id="text_14">
    <text style="font-size: 13px; font-family: 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #2b2a28" x="443.025216" y="407.176501" transform="rotate(-0 443.025216 407.176501)">decoder</text>
   </g>
   <g id="text_15">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #6e675c" x="443.025216" y="427.594074" transform="rotate(-0 443.025216 427.594074)">(h, z) → image</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #2b2a28" x="682.581312" y="179.728501" transform="rotate(-0 682.581312 179.728501)">imagine each action</text>
   </g>
   <g id="text_17">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #6e675c" x="682.581312" y="200.146074" transform="rotate(-0 682.581312 200.146074)">h′ₐ = GRU(h, z, a), z′ ~ prior</text>
   </g>
   <g id="text_18">
    <text style="font-size: 13px; font-family: 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #2b2a28" x="645.726528" y="310.300501" transform="rotate(-0 645.726528 310.300501)">goal head</text>
   </g>
   <g id="text_19">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #6e675c" x="645.726528" y="330.74323" transform="rotate(-0 645.726528 330.74323)">p(goal | h′, z′)</text>
   </g>
   <g id="text_20">
    <text style="font-size: 13px; font-family: 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #2b2a28" x="830.000448" y="310.300501" transform="rotate(-0 830.000448 310.300501)">critic</text>
   </g>
   <g id="text_21">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #6e675c" x="830.000448" y="330.718074" transform="rotate(-0 830.000448 330.718074)">V(h′, z′)</text>
   </g>
   <g id="text_22">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #2b2a28" x="737.863488" y="426.888661" transform="rotate(-0 737.863488 426.888661)">policy: Q(a) = mean of r + γ·c·V</text>
   </g>
   <g id="text_23">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #6e675c" x="737.863488" y="450.507354" transform="rotate(-0 737.863488 450.507354)">over 16 prior draws; ε-greedy, ε = 0.1</text>
   </g>
  </g>
  <g id="text_24">
   <text style="font-weight: 700; font-size: 21px; font-family: 'DejaVu Sans', sans-serif; text-anchor: start; fill: #2b2a28" x="43.1892" y="34.856719" transform="rotate(-0 43.1892 34.856719)">A world model that imagines the next step for each action</text>
  </g>
  <g id="text_25">
   <text style="font-size: 11.5px; font-family: 'DejaVu Sans', sans-serif; fill: #6e675c" transform="translate(43.1892 506.083037)">The critic is trained only in imagination, through the prior (15-step λ-returns). r and c come from the goal head (r = 50·p − (1 − p), c = 1 − p), γ =</text>
   <text style="font-size: 11.5px; font-family: 'DejaVu Sans', sans-serif; fill: #6e675c" transform="translate(43.1892 519.886182)">0.9. h: 64 units; z: 8 categorical variables × 8 classes. b reads the same prior through the decoder (T2).</text>
  </g>
 </g>

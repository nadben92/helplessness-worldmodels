    <text style="font-size: 11.5px; font-family: 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #6e675c" x="111.33216" y="304.013994" transform="rotate(-0 111.33216 304.013994)">one per action</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #2b2a28" x="314.033472" y="278.794741" transform="rotate(-0 314.033472 278.794741)">predicted z′</text>
   </g>
   <g id="text_12">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #6e675c" x="314.033472" y="304.013994" transform="rotate(-0 314.033472 304.013994)">16 draws of the prior</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #2b2a28" x="572.01696" y="134.912821" transform="rotate(-0 572.01696 134.912821)">decoder + nearest template</text>
   </g>
   <g id="text_14">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #6e675c" x="572.01696" y="161.75779" transform="rotate(-0 572.01696 161.75779)">→ predicted cell → I(a; s′|s) → b</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #2b2a28" x="572.01696" y="278.120821" transform="rotate(-0 572.01696 278.120821)">critic V(h′ₐ, z′) + goal head</text>
   </g>
   <g id="text_16">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #6e675c" x="572.01696" y="304.940634" transform="rotate(-0 572.01696 304.940634)">→ Q(a) → action</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #2b2a28" x="572.01696" y="421.357258" transform="rotate(-0 572.01696 421.357258)">KL(target ‖ p(z′ | h′ₐ))</text>
   </g>
   <g id="text_18">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #6e675c" x="572.01696" y="448.148634" transform="rotate(-0 572.01696 448.148634)">→ gradient on h (latent correction A)</text>
   </g>
  </g>
  <g id="text_19">
   <text style="font-weight: 700; font-size: 21px; font-family: 'DejaVu Sans', sans-serif; text-anchor: start; fill: #2b2a28" x="43.1892" y="34.856719" transform="rotate(-0 43.1892 34.856719)">Three readers of the same prediction can disagree</text>
  </g>
  <g id="text_20">
   <text style="font-size: 13px; font-family: 'DejaVu Sans', sans-serif; text-anchor: start; fill: #6e675c" x="43.1892" y="62.257969" transform="rotate(-0 43.1892 62.257969)">What b measures is not necessarily what the policy uses</text>
  </g>
  <g id="text_21">
   <text style="font-size: 11.5px; font-family: 'DejaVu Sans', sans-serif; fill: #6e675c" transform="translate(43.1892 506.083037)">All three read the same prior p(z′ | h′ₐ); they differ in what they extract from it. Findings on E4's four agents (CPU, frozen weights):</text>
   <text style="font-size: 11.5px; font-family: 'DejaVu Sans', sans-serif; fill: #6e675c" transform="translate(43.1892 519.886182)">experiments/E6_phenotypes_latent/IMPLEMENTATION_REPORT.md §17–20.</text>
  </g>

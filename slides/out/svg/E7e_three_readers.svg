   <g id="text_7">
    <text style="font-size: 12px; font-family: 'DejaVu Sans', sans-serif; fill: #2b2a28" transform="translate(710.2224 346.518375)">Correction A raises 3 and 1</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans', sans-serif; fill: #2b2a28" transform="translate(710.2224 360.921656)">(b +1.2 to +1.9 bit), but 2 stays</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans', sans-serif; fill: #2b2a28" transform="translate(710.2224 375.324937)">at chance for 3 of 4 agents (D7)</text>
   </g>
   <g id="text_8">
    <text style="font-size: 12px; font-family: 'DejaVu Sans', sans-serif; fill: #2b2a28" transform="translate(710.2224 203.310375)">Induced references: 1 says the</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans', sans-serif; fill: #2b2a28" transform="translate(710.2224 217.713656)">action fails in about half the</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans', sans-serif; fill: #2b2a28" transform="translate(710.2224 232.116938)">steps; 2 still steers (D5, D6)</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #2b2a28" x="111.33216" y="278.794741" transform="rotate(-0 111.33216 278.794741)">h′ₐ = GRU(h, z, a)</text>
   </g>
